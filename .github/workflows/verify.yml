name: Verify application
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://preview.example.test
      AUTOLOCAL_ENABLE_BILLING: 'false'
      AUTOLOCAL_ENABLE_PUBLISHING: 'false'
      AUTOLOCAL_ENABLE_DOMAIN_PURCHASES: 'false'
      AUTOLOCAL_ENABLE_EMAIL: 'false'
      AUTOLOCAL_ENABLE_GOOGLE_CONNECTIONS: 'false'
      AUTOLOCAL_ENABLE_GBP_WRITES: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
